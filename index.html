<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Kerfloop</title>
    <!-- Added to an iPad's home screen, the page opens full screen without the browser's bars. -->
    <link rel="icon" type="image/png" sizes="32x32" href="TemplateData/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icon-192.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <style>
      /* Copied from Compulsory Purchase's launch page, in the Woolyback ident's ink and cream, so loading runs straight into the ident. No Unity logo. */
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden; background: #16181D; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #16181D; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; width: 180px; height: 3px; margin: -2px 0 0 -90px; background: rgba(244, 239, 230, .18); }
      #loading-bar { width: 0; height: 100%; background: #F4EFE6; }
      #warning { position: fixed; left: 0; right: 0; top: 0; font: 14px sans-serif; text-align: center; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"></div></div>
    <div id="warning"></div>
    <script src="Build/cd967c54c5f2c9a12f704c880d62e447.loader.js"></script>
    <script>
      // A message from the engine: an error stays, anything else goes after a few seconds.
      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "#B3261E; color: #EDE3C8" : "#1A1A17; color: #EDE3C8");
        box.appendChild(div);
        box.style.display = "block";
        if (type != "error") setTimeout(function () { box.removeChild(div); if (!box.children.length) box.style.display = "none"; }, 5000);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/5b6259ca54dd4cd1fbf56005c1510b02.data.unityweb",
        frameworkUrl: "Build/d73dbb62913f2212f57b5f671505fd0f.framework.js.unityweb",
        codeUrl: "Build/372b551026f923c4b2ea04d75f74c936.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Woolyback LLC",
        productName: "Kerfloop",
        productVersion: "1.0",
        showBanner: showBanner,
        autoSyncPersistentDataPath: true, // machines kept on the shelf stay after the page is closed
        // A sound the browser cannot decode should cost only that sound, not stop the game with a box.
        errorHandler: function (err, url, line) {
          var m = String(err);
          // keep every error, with where it came from, for the ?log view below
          (window.kerfloopErrors = window.kerfloopErrors || []).push(new Date().toISOString() + "  " + m + (url ? "  @ " + url + ":" + line : ""));
          if (window.kerfloopShowLog) window.kerfloopShowLog();
          // "Script error." is all a browser says when it hides an error's details (often from outside the game,
          // such as an extension or a page translator); the game carries on, so do not stop it with a box
          if (m.indexOf("Script error") === 0) { console.warn("Hidden script error skipped"); return true; }
          if (m.indexOf("EncodingError") >= 0 || m.indexOf("Decoding failed") >= 0 || m.indexOf("decodeAudioData") >= 0) {
            console.warn("A sound could not be decoded and was skipped: " + m);
            return true;
          }
          return false;
        },
      }, function (progress) {
        document.querySelector("#loading-bar").style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        window.kerfloopInstance = unityInstance;
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
      // Open the page as .../?log to see any errors (to send to us); nothing is sent anywhere.
      if (/[?&]log/.test(location.search)) {
        var box = document.createElement("pre");
        box.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;margin:0;padding:8px;background:rgba(0,0,0,0.8);color:#fdf3dc;font:12px monospace;z-index:9999;white-space:pre-wrap";
        box.textContent = "Kerfloop log: no errors yet.";
        document.body.appendChild(box);
        var stats = "";
        window.kerfloopShowLog = function () { box.textContent = stats + String.fromCharCode(10) + (window.kerfloopErrors || []).join(String.fromCharCode(10)); };
        window.kerfloopShowStats = function (t) { stats = t; window.kerfloopShowLog(); };
        window.addEventListener("error", function (e) {
          (window.kerfloopErrors = window.kerfloopErrors || []).push(new Date().toISOString() + "  window: " + e.message + " @ " + e.filename + ":" + e.lineno + (e.error && e.error.stack ? String.fromCharCode(10) + e.error.stack : ""));
          window.kerfloopShowLog();
        });
      }
    </script>
  </body>
</html>
